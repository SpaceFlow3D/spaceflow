name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU service and examples (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: macos-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/editor.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install the CPU-only editor service
        run: python -m pip install -r requirements/editor.txt
      - name: Check dependencies and CPU workflows
        run: |
          python -m pip check
          python tools/doctor.py --editor
          python -m unittest discover -s tests -v
      - name: Validate all published primitive bundles and replay configurations
        run: python tools/validate_examples.py --report spaceflow_runtime/example-validation.json
      - name: Upload example validation
        uses: actions/upload-artifact@v4
        with:
          name: examples-${{ matrix.os }}-py${{ matrix.python }}
          path: spaceflow_runtime/example-validation.json

  ui:
    name: Editor tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sq_ui/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sq_ui/app/package-lock.json
      - run: npm ci --include=optional
      - run: npm test
      - run: npm run build
